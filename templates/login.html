{% extends 'base.html' %}

{% block title %}Вход{% endblock %}

{% block content %}
    <h2>Вход в систему</h2>
    <form id="login-form" method="post" novalidate>
        {% csrf_token %}

        <div class="form-group">
            <label for="username_or_email">Логин или Email</label>
            <input type="text" id="username_or_email" name="username_or_email" value="{{ form_data.username_or_email|default:'' }}" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group captcha-group">
            <label>Сколько будет {{ captcha.display }}?</label>
            <input type="text" name="captcha_answer" placeholder="Введите ответ" required>
        </div>

        <button type="submit">Войти</button>
    </form>
    <p class="auth-link">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
{% endblock %}
