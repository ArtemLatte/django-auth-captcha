{% extends 'base.html' %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <h2>Регистрация</h2>
    <form id="register-form" method="post" novalidate>
        {% csrf_token %}

        <div class="form-group">
            <label for="username">Имя пользователя</label>
            <input type="text" id="username" name="username" value="{{ form_data.username|default:'' }}" required>
            <small>Только латиница и цифры, 3-20 символов</small>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ form_data.email|default:'' }}" required>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required>
            <small>Минимум 6 символов (буквы + цифры)</small>
        </div>

        <div class="form-group">
            <label for="confirm_password">Подтверждение пароля</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>

        <div class="form-group captcha-group">
            <label>Сколько будет {{ captcha.display }}?</label>
            <input type="text" name="captcha_answer" placeholder="Введите ответ" required>
        </div>

        <button type="submit">Зарегистрироваться</button>
    </form>
    <p class="auth-link">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
{% endblock %}
